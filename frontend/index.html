    <script>
      // Set the theme class before the stylesheet paints. useTheme() keeps
      // ownership of every later change; this only removes the light-flash
      // dark-mode users would otherwise get on every hard load.
      (function () {
        try {
          if (localStorage.getItem('academiai-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* storage blocked — stay on the light default */
        }
      })();
    </script>
