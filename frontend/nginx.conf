# Nginx config for the AcademiAI SPA container.
#
# The React app is a client-side SPA: unknown paths must fall back to
# index.html so deep links (e.g. /dashboard) render instead of 404'ing.
# /api/v1 and /media are proxied to the Django backend so this image can act
# as the sole exposed tier (typically behind a reverse proxy/load balancer).
#
# The backend is expected at `backend:8000` (the container name in the app
# compose file). If yours differs, either rename the service to `backend` or
# build/override this file — there is intentionally no nginx-level env
# substitution here.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets: hashed by Vite -> immutable, aggressively cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached (new deploys ship new hashes).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # PWA manifest is versioned per build; service worker must be re-validated.
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API + media -> Django.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 10m;
    }

    # SPA fallback — everything else serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}