        provisioning concerns handled exclusively via tenant-request approval, so
        this view does not expose POST or DELETE. Updates (status suspension /
        reactivation) are reserved for the platform superuser; all other tenant
        details are read-only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      tags:
      - Tenants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTenantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTenantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTenantRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          description: ''
  /api/v1/tenants/directory/:
    get:
      operationId: v1_tenants_directory_retrieve
      description: Public, non-sensitive directory of ACTIVE institutions for the
        signup dropdown and landing-page search. Exposes only id, name and slug; supports
        ?search= filtering.
      summary: Browse active institutions
      tags:
