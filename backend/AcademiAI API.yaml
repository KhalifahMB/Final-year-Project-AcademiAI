openapi: 3.0.3
info:
  title: AcademiAI API
  version: 1.0.0
  description: Multi-tenant academic AI platform API
paths:
  /api/public/stats/:
    get:
      operationId: public_stats_retrieve
      description: 'Unauthenticated aggregates for the landing page, cached server-side
        for exactly one hour. Returns only coarse platform-wide totals: total students,
        total active institutions, average study time per completed session, and backend
        service uptime. No per-tenant or per-user rows are ever exposed.'
      summary: Read landing-page statistics
      tags:
      - Public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStats'
          description: ''
  /api/v1/academic-sessions/:
    get:
      operationId: v1_academic_sessions_list
      description: |-
        All authenticated tenant members may read; only Admins may create,
        update or delete. Used for institutional/academic structure endpoints.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Academic Sessions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcademicSessionList'
          description: ''
    post:
      operationId: v1_academic_sessions_create
      description: |-
        All authenticated tenant members may read; only Admins may create,
        update or delete. Used for institutional/academic structure endpoints.
      tags:
      - Academic Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicSessionRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicSession'
          description: ''
  /api/v1/academic-sessions/{id}/:
    get:
      operationId: v1_academic_sessions_retrieve
      description: |-
        All authenticated tenant members may read; only Admins may create,
        update or delete. Used for institutional/academic structure endpoints.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this academic session.
        required: true
      tags:
      - Academic Sessions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicSession'
          description: ''
    put:
      operationId: v1_academic_sessions_update
      description: |-
        All authenticated tenant members may read; only Admins may create,
        update or delete. Used for institutional/academic structure endpoints.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this academic session.
        required: true
      tags:
      - Academic Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicSessionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicSession'
          description: ''
    patch:
      operationId: v1_academic_sessions_partial_update
      description: |-
        All authenticated tenant members may read; only Admins may create,
        update or delete. Used for institutional/academic structure endpoints.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this academic session.
        required: true
      tags:
      - Academic Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAcademicSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAcademicSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAcademicSessionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicSession'
          description: ''
    delete:
      operationId: v1_academic_sessions_destroy
      description: |-
        All authenticated tenant members may read; only Admins may create,
        update or delete. Used for institutional/academic structure endpoints.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this academic session.
        required: true
      tags:
      - Academic Sessions
      responses:
        '204':
          description: No response body
  /api/v1/agent/avatar/:
    post:
      operationId: v1_agent_avatar_create
      description: |-
        POST /api/v1/agent/avatar/
        Upload a custom agent avatar image. Accepts image/png, image/jpeg,
        image/webp and image/svg+xml (max 1 MB). Persists the file and returns the
        public URL to store in AgentSettings.avatar.
      tags:
      - Agent
      responses:
        '200':
          description: No response body
  /api/v1/agent/identities/:
    get:
      operationId: v1_agent_identities_retrieve
      description: |-
        GET /api/v1/agent/identities/
        Returns the agent identities available to the current user's role, the
        per-role default, and the user's persisted agent settings.
      tags:
      - Agent
      responses:
        '200':
          description: No response body
  /api/v1/agent/sessions/:
    get:
      operationId: v1_agent_sessions_list
      description: |-
        List, create, retrieve (with full recent_messages), rename and delete the
        current user's agent sessions. Sessions are always scoped to the owner's
        tenant and user; cross-tenant access is denied.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Agent
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgentSessionList'
          description: ''
    post:
      operationId: v1_agent_sessions_create
      description: |-
        List, create, retrieve (with full recent_messages), rename and delete the
        current user's agent sessions. Sessions are always scoped to the owner's
        tenant and user; cross-tenant access is denied.
      tags:
      - Agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentSessionRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
          description: ''
  /api/v1/agent/sessions/{id}/:
    get:
      operationId: v1_agent_sessions_retrieve
      description: |-
        List, create, retrieve (with full recent_messages), rename and delete the
        current user's agent sessions. Sessions are always scoped to the owner's
        tenant and user; cross-tenant access is denied.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this agent session.
        required: true
      tags:
      - Agent
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionDetail'
          description: ''
    patch:
      operationId: v1_agent_sessions_partial_update
      description: |-
        List, create, retrieve (with full recent_messages), rename and delete the
        current user's agent sessions. Sessions are always scoped to the owner's
        tenant and user; cross-tenant access is denied.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this agent session.
        required: true
      tags:
      - Agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAgentSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAgentSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAgentSessionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
          description: ''
    delete:
      operationId: v1_agent_sessions_destroy
      description: |-
        List, create, retrieve (with full recent_messages), rename and delete the
        current user's agent sessions. Sessions are always scoped to the owner's
        tenant and user; cross-tenant access is denied.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this agent session.
        required: true
      tags:
      - Agent
      responses:
        '204':
          description: No response body
  /api/v1/agent/settings/:
    get:
      operationId: v1_agent_settings_retrieve
      description: |-
        GET/PUT /api/v1/agent/settings/
        Read or update the current user's agent preferences (default agent, tone,
        AI filters, reminders, visibility, avatar).
      tags:
      - Agent
      responses:
        '200':
          description: No response body
    put:
      operationId: v1_agent_settings_update
      description: |-
        GET/PUT /api/v1/agent/settings/
        Read or update the current user's agent preferences (default agent, tone,
        AI filters, reminders, visibility, avatar).
      tags:
      - Agent
      responses:
        '200':
          description: No response body
  /api/v1/agent/stream/:
    post:
      operationId: v1_agent_stream_create
      description: |-
        POST /api/v1/agent/stream/
        Body: {
            "message": "...",
            "context_type": "dashboard"|"chat"|"plans"|"resources",
            "session_id": "<uuid>",  # optional: resume a specific session
            "agent": "tutor",        # optional: agent identity key
            "title": "..."           # optional: initial title for a new session
        }

        Streams agent response as Server-Sent Events with tool call transparency.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/agent/tools/:
    get:
      operationId: v1_agent_tools_retrieve
      description: |-
        GET /api/v1/agent/tools/
        Returns the list of available agent tools (for transparency/debugging).
      tags:
      - Agent
      responses:
        '200':
          description: No response body
  /api/v1/announcements/:
    get:
      operationId: v1_announcements_list
      summary: Platform announcements (superuser CRUD)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Platform
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementList'
          description: ''
    post:
      operationId: v1_announcements_create
      summary: Platform announcements (superuser CRUD)
      tags:
      - Platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
  /api/v1/announcements/{id}/:
    get:
      operationId: v1_announcements_retrieve
      summary: Platform announcements (superuser CRUD)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcement.
        required: true
      tags:
      - Platform
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
    put:
      operationId: v1_announcements_update
      summary: Platform announcements (superuser CRUD)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcement.
        required: true
      tags:
      - Platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
    patch:
      operationId: v1_announcements_partial_update
      summary: Platform announcements (superuser CRUD)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcement.
        required: true
      tags:
      - Platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
    delete:
      operationId: v1_announcements_destroy
      summary: Platform announcements (superuser CRUD)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcement.
        required: true
      tags:
      - Platform
      responses:
        '204':
          description: No response body
  /api/v1/announcements/active/:
    get:
      operationId: v1_announcements_active_retrieve
      description: Public. Returns active announcements targeting this tenant or all
        tenants.
      summary: Active announcements for a tenant
      tags:
      - Platform
      responses:
        '200':
          description: No response body
  /api/v1/announcements/subscriptions/:
    get:
      operationId: v1_announcements_subscriptions_retrieve
      description: Authenticated user's announcement subscription. Only the 'info'
        type can be toggled; important (warning/critical) announcements are always
        emailed.
      summary: Current user announcement email preferences
      tags:
      - Platform
      responses:
        '200':
          description: No response body
    put:
      operationId: v1_announcements_subscriptions_update
      description: Authenticated user's announcement subscription. Only the 'info'
        type can be toggled; important (warning/critical) announcements are always
        emailed.
      summary: Current user announcement email preferences
      tags:
      - Platform
      responses:
        '200':
          description: No response body
  /api/v1/audit-logs/:
    get:
      operationId: v1_audit_logs_list
      description: Read-only, append-only security audit trail for the tenant. Visible
        to Admins only; no update or delete endpoints exist by design.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: entity_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Administration
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit-logs/{id}/:
    get:
      operationId: v1_audit_logs_retrieve
      description: Read-only, append-only security audit trail for the tenant. Visible
        to Admins only; no update or delete endpoints exist by design.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audit log.
        required: true
      tags:
      - Administration
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      summary: Authenticate and return access/refresh tokens
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      summary: Blacklist the refresh token and clear auth cookies
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: |-
        GET  /auth/me/ — authenticated profile.
        PATCH /auth/me/ — update own display name only (role/tenant are
        server-controlled; see ProfileUpdateSerializer).
      summary: Get authenticated profile
      tags:
      - Authentication
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_auth_me_update
      description: |-
        GET  /auth/me/ — authenticated profile.
        PATCH /auth/me/ — update own display name only (role/tenant are
        server-controlled; see ProfileUpdateSerializer).
      summary: Replace own display name
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
        required: true
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdate'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      description: Personal data only (name, email, phone, gender, avatar preset);
        role, tenant, and verification state are server-controlled.
      summary: Update own personal profile
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdate'
          description: ''
  /api/v1/auth/me/avatar/:
    get:
      operationId: v1_auth_me_avatar_retrieve
      description: |-
        GET    /auth/me/avatar/ — short-lived signed URL for the user's uploaded
                picture (empty url when none).
        POST   /auth/me/avatar/ — multipart upload (field `file`, <=2 MB,
                png/jpeg/gif/webp). Stored under the tenant's storage partition.
        DELETE /auth/me/avatar/ — remove the custom picture.
      summary: Get own avatar URL
      tags:
      - Profile
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_auth_me_avatar_create
      description: |-
        GET    /auth/me/avatar/ — short-lived signed URL for the user's uploaded
                picture (empty url when none).
        POST   /auth/me/avatar/ — multipart upload (field `file`, <=2 MB,
                png/jpeg/gif/webp). Stored under the tenant's storage partition.
        DELETE /auth/me/avatar/ — remove the custom picture.
      summary: Upload own avatar picture
      tags:
      - Profile
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_auth_me_avatar_destroy
      description: |-
        GET    /auth/me/avatar/ — short-lived signed URL for the user's uploaded
                picture (empty url when none).
        POST   /auth/me/avatar/ — multipart upload (field `file`, <=2 MB,
                png/jpeg/gif/webp). Stored under the tenant's storage partition.
        DELETE /auth/me/avatar/ — remove the custom picture.
      summary: Remove own avatar picture
      tags:
      - Profile
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-change/:
    post:
      operationId: v1_auth_password_change_create
      summary: Change password for the authenticated user
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      summary: Confirm password reset with a single-use 6-digit code
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
