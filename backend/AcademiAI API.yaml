        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - completed
          - dropped
          - enrolled
        description: |-
          * `enrolled` - Enrolled
          * `completed` - Completed
          * `dropped` - Dropped
      - in: query
        name: student
