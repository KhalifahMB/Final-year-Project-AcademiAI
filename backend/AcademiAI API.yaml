      description: Public. Lets a visitor (e.g. an ICT director, lecturer) request
        their university be provisioned on AcademiAI. Rate-limit this in production.
      summary: Request a new institution (public)
      tags:
      - Tenants
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/tenant-requests/check-email/:
    post:
      operationId: v1_tenant_requests_check_email_create
      description: Public step-1 gate for the institution-request wizard. Returns
        whether the address is already attached to an account. Rate-limited via the
        tenant_request throttle.
      summary: Check requester email availability (public)
      tags:
      - Tenants
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/tenants/:
    get:
      operationId: v1_tenants_list
      description: |-
        Tenant CRUD. Reads are limited to the caller's own tenant
        (superusers may list all). Creation and destruction are platform
        provisioning concerns handled exclusively via tenant-request approval, so
        this view does not expose POST or DELETE. Updates (status suspension /
        reactivation) are reserved for the platform superuser; all other tenant
        details are read-only.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Tenants
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTenantList'
          description: ''
  /api/v1/tenants/{id}/:
    get:
      operationId: v1_tenants_retrieve
      description: |-
        Tenant CRUD. Reads are limited to the caller's own tenant
        (superusers may list all). Creation and destruction are platform
        provisioning concerns handled exclusively via tenant-request approval, so
        this view does not expose POST or DELETE. Updates (status suspension /
        reactivation) are reserved for the platform superuser; all other tenant
