  /api/v1/resources/:
    get:
      operationId: v1_resources_list
      description: |-
        Tenant-scoped resource metadata CRUD plus the upload lifecycle:

        1. POST  {id}/request_upload_url/ — obtain a presigned URL + storage key
        2. PUT   the file bytes to that URL (direct to MinIO/S3)
        3. POST  {id}/complete_upload/    — register the version and start async
           ingestion (validation → extraction → chunking → embedding)

        Authorization-first visibility: students/lecturers only ever see (list
        AND retrieve) materials their academic scope allows — private materials
        of other users are invisible even by direct id. Admins see the whole
        tenant; platform superusers likewise. `?scope=authorized` is accepted
        for backwards compatibility and is now the default behaviour.
      parameters:
      - in: query
        name: course_offering
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: processing_status
        schema:
          type: string
          enum:
          - failed
          - pending
          - processing
          - ready
        description: |-
          * `pending` - Pending
          * `processing` - Processing
          * `ready` - Ready
          * `failed` - Failed
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: visibility_scope
        schema:
          type: string
          enum:
          - course
          - department
          - faculty
          - institution
          - private
          - programme
        description: |-
          * `private` - Private
          * `course` - Course
          * `programme` - Programme
          * `department` - Department
          * `faculty` - Faculty
          * `institution` - Institution
      tags:
      - Resources
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResourceList'
          description: ''
    post:
      operationId: v1_resources_create
      description: |-
        Tenant-scoped resource metadata CRUD plus the upload lifecycle:

        1. POST  {id}/request_upload_url/ — obtain a presigned URL + storage key
        2. PUT   the file bytes to that URL (direct to MinIO/S3)
        3. POST  {id}/complete_upload/    — register the version and start async
           ingestion (validation → extraction → chunking → embedding)

        Authorization-first visibility: students/lecturers only ever see (list
        AND retrieve) materials their academic scope allows — private materials
        of other users are invisible even by direct id. Admins see the whole
        tenant; platform superusers likewise. `?scope=authorized` is accepted
        for backwards compatibility and is now the default behaviour.
      tags:
      - Resources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
          description: ''
  /api/v1/resources/{id}/:
    get:
      operationId: v1_resources_retrieve
      description: |-
        Serve authorized detail reads from Redis, tenant-scoped.

        Authorization ALWAYS runs first (get_object -> _authorized_resources_q
        + TenantObjectPermission), so a cache hit is only ever served to a
        user who can legitimately read the material. The key embeds the
        resource's updated_at, so writes invalidate the entry implicitly.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this resource.
        required: true
      tags:
      - Resources
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
          description: ''
    put:
      operationId: v1_resources_update
      description: |-
        Tenant-scoped resource metadata CRUD plus the upload lifecycle:

        1. POST  {id}/request_upload_url/ — obtain a presigned URL + storage key
        2. PUT   the file bytes to that URL (direct to MinIO/S3)
        3. POST  {id}/complete_upload/    — register the version and start async
           ingestion (validation → extraction → chunking → embedding)

        Authorization-first visibility: students/lecturers only ever see (list
        AND retrieve) materials their academic scope allows — private materials
        of other users are invisible even by direct id. Admins see the whole
        tenant; platform superusers likewise. `?scope=authorized` is accepted
        for backwards compatibility and is now the default behaviour.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this resource.
        required: true
      tags:
      - Resources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
        required: true
