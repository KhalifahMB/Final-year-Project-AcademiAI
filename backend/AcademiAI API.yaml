components:
  schemas:
    AcademicSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
        tenant:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - name
      - start_date
      - tenant
    AcademicSessionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
      required:
      - end_date
      - name
      - start_date
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        entity_type:
          type: string
          readOnly: true
        entity_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - entity_id
      - entity_type
      - id
      - metadata
      - tenant
    Bookmark:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        resource:
          type: string
          format: uuid
        user:
          type: string
          format: uuid
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - resource
      - tenant
      - user
    BookmarkRequest:
      type: object
      properties:
        resource:
          type: string
          format: uuid
      required:
      - resource
    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        session:
          type: string
          format: uuid
        role:
          allOf:
          - $ref: '#/components/schemas/ChatMessageRoleEnum'
          readOnly: true
        content:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageSource'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - role
      - session
      - sources
    ChatMessageRoleEnum:
      enum:
      - user
      - assistant
      - system
      type: string
      description: |-
        * `user` - User
        * `assistant` - Assistant
        * `system` - System
    ChatMessageSource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        chunk:
          type: string
          format: uuid
          readOnly: true
        rank:
          type: integer
          readOnly: true
        similarity_score:
          type: number
          format: double
          readOnly: true
          nullable: true
        retrieval_method:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chunk
      - created_at
      - id
      - rank
      - retrieval_method
      - similarity_score
