        name:
          type: string
          maxLength: 255
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        domain:
          type: string
          nullable: true
          maxLength: 255
        status:
          allOf:
          - $ref: '#/components/schemas/TenantStatusEnum'
          readOnly: true
        plan:
          type: string
          readOnly: true
        storage_quota_bytes:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - plan
      - slug
      - status
      - storage_quota_bytes
      - updated_at
    TenantLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        action:
          type: string
          readOnly: true
        actor_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_email:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        request_path:
          type: string
          readOnly: true
        request_method:
          type: string
          readOnly: true
        response_status_code:
          type: integer
          readOnly: true
          nullable: true
        response_time_ms:
          type: integer
          readOnly: true
          nullable: true
        details:
          readOnly: true
      required:
      - action
      - actor_email
      - actor_id
      - category
      - details
      - id
      - ip_address
      - level
      - request_method
      - request_path
      - response_status_code
      - response_time_ms
      - timestamp
      - user_agent
    TenantStatusEnum:
      enum:
      - active
      - suspended
      - pending
      type: string
      description: |-
        * `active` - Active
        * `suspended` - Suspended
        * `pending` - Pending
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    User:
      type: object
      description: |-
        Read representation of a user. Writable only via ProfileUpdateSerializer
        (self-service) or UserAdminViewSet (tenant admin).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        tenant:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        tenant_detail:
          type: string
          readOnly: true
        programme_id:
          type: string
          readOnly: true
        department_id:
          type: string
          readOnly: true
        department_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          readOnly: true
        avatar_preset:
          type: string
          readOnly: true
        has_custom_avatar:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar_preset
      - created_at
      - department_id
      - department_name
      - email
      - first_name
      - full_name
      - gender
      - has_custom_avatar
      - id
      - is_active
      - is_email_verified
      - is_superuser
      - last_name
      - phone_number
      - programme_id
      - role
      - tenant
      - tenant_detail
    UserAdminUpdate:
      type: object
      description: |-
        Tenant-admin user management (PATCH). Only a safe allowlist of fields is
        writable. Security-critical fields — tenant, email, is_superuser, is_staff,
        is_email_verified — are intentionally NOT exposed here so an admin cannot
        escalate a user's privileges or reassign tenant.
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        is_active:
          type: boolean
        phone_number:
          type: string
          maxLength: 32
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        avatar_preset:
          type: string
          maxLength: 32
    UserRoleEnum:
      enum:
      - student
      - lecturer
      - tenant_admin
      type: string
      description: |-
        * `student` - Student
        * `lecturer` - Lecturer
        * `tenant_admin` - Tenant Admin
    VerifyEmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: string
          minLength: 1
          pattern: ^\d{6}$
      required:
      - code
      - email
    VisibilityEnum:
      enum:
      - private
      - tenant
      type: string
      description: |-
        * `private` - Private
        * `tenant` - Institution-wide
